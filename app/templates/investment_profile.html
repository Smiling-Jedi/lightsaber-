{% extends "base.html" %}
{% block title %}投资中枢 · 档案与框架{% endblock %}

{% block extra_css %}
<style>
    .profile-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        font-size: 0.9rem;
    }
    .profile-content th {
        background: #f8f9fa;
        padding: 8px 12px;
        border: 1px solid #dee2e6;
        text-align: left;
        font-weight: 600;
    }
    .profile-content td {
        padding: 7px 12px;
        border: 1px solid #dee2e6;
        vertical-align: top;
    }
    .profile-content tr:nth-child(even) td { background: #fafafa; }
    .profile-content h2 {
        margin-top: 2rem;
        padding-bottom: 0.4rem;
        border-bottom: 2px solid #dee2e6;
        font-size: 1.2rem;
    }
    .profile-content h3 { margin-top: 1.4rem; font-size: 1rem; color: #333; }
    .profile-content code {
        background: #f4f4f4;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.88em;
    }
    .profile-content pre {
        background: #f8f9fa;
        padding: 12px;
        border-radius: 6px;
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <h5 class="mb-0">📋 投资档案与框架</h5>
    <a href="/investment/" class="btn btn-sm btn-outline-secondary">← 返回报告</a>
</div>

<ul class="nav nav-tabs mb-4" id="profileTabs">
    <li class="nav-item">
        <a class="nav-link active" data-bs-toggle="tab" href="#tab-system">系统说明</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" href="#tab-framework">五维雷达框架</a>
    </li>
</ul>

<div class="tab-content">
    <div class="tab-pane fade show active" id="tab-system">
        <div class="card p-4 profile-content">
            {{ profile_html | safe }}
        </div>
    </div>
    <div class="tab-pane fade" id="tab-framework">
        <div class="card p-4 profile-content">
            {{ framework_html | safe }}
        </div>
    </div>
</div>
{% endblock %}
