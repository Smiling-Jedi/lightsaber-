<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}小光剑{% endblock %}</title>
  <style>
    /* ── 基础重置 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 桌面端模拟手机 ── */
    @media (min-width: 769px) {
      body {
        background: #f0f0f0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      .mobile-wrapper {
        width: 100%;
        max-width: 480px;
        background: #fff;
        min-height: 100vh;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
      }
    }
    @media (max-width: 768px) {
      .mobile-wrapper { width: 100%; }
    }

    /* ── 顶部导航 ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #e8e8e8;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #333;
    }
    .header-meta {
      font-size: 12px;
      color: #999;
    }

    /* ── 市场Tab ── */
    .market-tabs {
      display: flex;
      border-bottom: 1px solid #e8e8e8;
      background: #fff;
      position: sticky;
      top: 49px;
      z-index: 99;
    }
    .market-tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .market-tab.active {
      color: #333;
      font-weight: 600;
      border-bottom-color: #333;
    }

    /* ── 卡片 ── */
    .card {
      margin: 12px 16px;
      border: 1px solid #e8e8e8;
      background: #fff;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .card-stock-name {
      font-size: 16px;
      font-weight: 600;
    }
    .card-stock-code {
      font-size: 12px;
      color: #999;
      margin-left: 4px;
    }
    .card-price {
      text-align: right;
    }
    .card-price-value {
      font-size: 16px;
      font-weight: 600;
    }
    .card-price-change {
      font-size: 12px;
    }

    /* ── 涨跌色 ── */
    .up { color: #E74C3C; }
    .down { color: #27AE60; }
    .neutral { color: #999; }

    /* ── 持仓信息 ── */
    .card-position {
      padding: 10px 16px;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
    }

    /* ── 形态分析区 ── */
    .card-patterns {
      padding: 10px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .pattern-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 13px;
    }
    .pattern-label {
      color: #666;
    }
    .pattern-value {
      font-weight: 500;
    }

    /* ── 共振状态 ── */
    .card-resonance {
      padding: 10px 16px;
      border-bottom: 1px solid #f0f0f0;
      background: #fafafa;
    }
    .resonance-title {
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }
    .resonance-state {
      font-size: 14px;
      font-weight: 600;
    }
    .resonance-desc {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ── 底部信息 ── */
    .card-footer {
      padding: 8px 16px;
      font-size: 11px;
      color: #bbb;
      display: flex;
      justify-content: space-between;
    }

    /* ── 内容区 ── */
    .content {
      padding-bottom: 20px;
    }

    /* ── Tab内容 ── */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* ── 空状态 ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="mobile-wrapper">
    {% block content %}{% endblock %}
  </div>

  <script>
    // Tab切换
    function switchTab(market) {
      document.querySelectorAll('.market-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelector('.market-tab[data-market="' + market + '"]').classList.add('active');
      document.querySelector('.tab-content[data-market="' + market + '"]').classList.add('active');
      localStorage.setItem('mini_active_tab', market);
    }

    // 恢复上次选中的Tab
    document.addEventListener('DOMContentLoaded', function() {
      const saved = localStorage.getItem('mini_active_tab') || 'HK';
      switchTab(saved);
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
